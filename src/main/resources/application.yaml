

spring:
  application:
    name: com.company.FSA_Captone_2026

  # JPA/Database Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Ensuring schema matches Entities
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC  # ISO 8601 compliance

  datasource:
    url: jdbc:postgresql://${PGHOST:speak-journeyvn123.postgres.database.azure.com}:${PGPORT:5432}/${PGDATABASE:postgres}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:Pen1112003@}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      leak-detection-threshold: 60000  # 60s — avoids false-positive from slow scheduled tasks


  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Jackson Configuration (JavaTimeModule & disable timestamps via JacksonConfig.java)
  jackson:
    default-property-inclusion: non_null

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # Mail Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:nguyenductuan11012003@gmail.com}
    password: ${MAIL_PASSWORD:hofgtxuvvkiaqqgr}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
    test-connection: false  # Don't test SMTP on startup (avoid blocking)

# Mail App Configuration
mail:
  from: ${MAIL_FROM:nguyenductuan11012003@gmail.com}
  base-url: ${MAIL_BASE_URL:https://speakvn-frontend-379382117476.asia-southeast1.run.app}

server:
  port: 8082
  shutdown: GRACEFUL

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 3600000      # 1 hour in milliseconds
  refresh-token-expiration: 2592000000  # 30 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081,http://localhost:4200,https://localhost:5173,https://speakvn-frontend-379382117476.asia-southeast1.run.app}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  max-age: 3600
  allow-credentials: true

# Application API Configuration
app:
  api:
    title: FSA Capstone 2026 API
    description: API for FSA Capstone Project 2026
    version: 1.0.0
  contact:
    name: FSA Team
    email: contact@fsa.com

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.fsa_2026: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Social Login Configuration
