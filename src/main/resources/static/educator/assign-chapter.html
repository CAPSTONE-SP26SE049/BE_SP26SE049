<!doctype html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educator - Giao chương cho lớp</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e5e7eb;
            --success: #059669;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .topbar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        .title {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .menu {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .menu a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text);
            background: #fff;
            font-size: 14px;
        }

        .menu a.active {
            background: #eef2ff;
            border-color: #c7d2fe;
            color: #3730a3;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
        }

        .ok {
            color: var(--success);
        }

        .error {
            color: var(--danger);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 14px;
        }

        th,
        td {
            border-bottom: 1px solid var(--border);
            padding: 10px 6px;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="topbar">
            <h1 class="title">Giao chương cho lớp</h1>
            <p class="subtitle">Trang dành cho Educator để giao Level vào Classroom theo deadline.</p>
            <div class="menu">
                <a href="#" onclick="return false;">Dashboard</a>
                <a href="#" onclick="return false;">Lớp học</a>
                <a href="#" onclick="return false;">Nội dung</a>
                <a class="active" href="/educator/assign-chapter.html">Giao chương</a>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Tạo assignment mới</h3>
                <div class="field">
                    <label>Bearer Token</label>
                    <textarea id="token" rows="3" placeholder="Dán JWT token (không cần chữ Bearer)"></textarea>
                </div>
                <div class="field">
                    <label>Lớp học</label>
                    <select id="classroomId"></select>
                </div>
                <div class="field">
                    <label>Chương (Level)</label>
                    <select id="learningUnitId"></select>
                </div>
                <div class="field">
                    <label>Hạn nộp</label>
                    <input id="dueDate" type="datetime-local" />
                </div>
                <div class="field">
                    <label>Trạng thái</label>
                    <select id="status">
                        <option value="OPEN">OPEN</option>
                        <option value="CLOSED">CLOSED</option>
                    </select>
                </div>
                <div class="field">
                    <label>Ghi chú</label>
                    <textarea id="description" rows="3" placeholder="Ví dụ: Hoàn thành trước thứ 6"></textarea>
                </div>
                <div class="actions">
                    <button class="btn-primary" onclick="createAssignment()">Giao chương</button>
                    <button class="btn-secondary" onclick="loadInitData()">Tải lại dữ liệu</button>
                </div>
                <div id="createStatus" class="status"></div>
            </div>

            <div class="card">
                <h3>Danh sách assignment của tôi</h3>
                <div class="actions" style="margin-bottom:8px;">
                    <button class="btn-secondary" onclick="loadMyAssignments()">Làm mới danh sách</button>
                </div>
                <div style="overflow:auto; max-height:480px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Lớp</th>
                                <th>Chương</th>
                                <th>Hạn nộp</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="assignmentRows"></tbody>
                    </table>
                </div>
                <div id="listStatus" class="status"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';

        function getToken() {
            return document.getElementById('token').value.trim();
        }

        function authHeaders() {
            const token = getToken();
            if (!token) throw new Error('Bạn chưa nhập token');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function toIsoString(localDateTimeValue) {
            const date = new Date(localDateTimeValue);
            return date.toISOString();
        }

        function setStatus(id, message, ok = true) {
            const el = document.getElementById(id);
            el.className = `status ${ok ? 'ok' : 'error'}`;
            el.textContent = message;
        }

        async function loadClassrooms() {
            const res = await fetch(`${API_BASE}/educator/classrooms`, {
                headers: authHeaders()
            });
            const data = await res.json();
            if (!res.ok || data.status === 'error') throw new Error(data.message || 'Không tải được classrooms');

            const select = document.getElementById('classroomId');
            select.innerHTML = '';
            (data.data || []).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = `${c.name} (${c.code || 'N/A'})`;
                select.appendChild(opt);
            });
        }

        async function loadLevels() {
            const res = await fetch(`${API_BASE}/educator/levels`, {
                headers: authHeaders()
            });
            const data = await res.json();
            if (!res.ok || data.status === 'error') throw new Error(data.message || 'Không tải được levels');

            const select = document.getElementById('learningUnitId');
            select.innerHTML = '';
            (data.data || []).forEach(lv => {
                const opt = document.createElement('option');
                opt.value = lv.id;
                opt.textContent = `${lv.levelOrder ?? '-'} - ${lv.name}`;
                select.appendChild(opt);
            });
        }

        async function createAssignment() {
            try {
                const classroomId = document.getElementById('classroomId').value;
                const learningUnitId = document.getElementById('learningUnitId').value;
                const dueDateRaw = document.getElementById('dueDate').value;
                const status = document.getElementById('status').value;
                const description = document.getElementById('description').value;

                if (!classroomId || !learningUnitId || !dueDateRaw) {
                    throw new Error('Vui lòng chọn classroom, level và hạn nộp');
                }

                const payload = {
                    classroomId,
                    learningUnitId,
                    dueDate: toIsoString(dueDateRaw),
                    status,
                    description
                };

                const res = await fetch(`${API_BASE}/educator/assignments`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok || data.status === 'error') {
                    throw new Error(data.message || 'Tạo assignment thất bại');
                }

                setStatus('createStatus', 'Tạo assignment thành công');
                await loadMyAssignments();
            } catch (err) {
                setStatus('createStatus', err.message, false);
            }
        }

        async function loadMyAssignments() {
            try {
                const res = await fetch(`${API_BASE}/educator/assignments/me`, {
                    headers: authHeaders()
                });
                const data = await res.json();
                if (!res.ok || data.status === 'error') throw new Error(data.message || 'Không tải được danh sách assignment');

                const rows = document.getElementById('assignmentRows');
                rows.innerHTML = '';

                (data.data || []).forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.classroomName || ''}</td>
                        <td>${item.levelName || ''}</td>
                        <td>${item.dueDate ? new Date(item.dueDate).toLocaleString() : ''}</td>
                        <td>${item.status || ''}</td>
                    `;
                    rows.appendChild(tr);
                });

                setStatus('listStatus', `Đã tải ${data.data?.length || 0} assignment`);
            } catch (err) {
                setStatus('listStatus', err.message, false);
            }
        }

        async function loadInitData() {
            try {
                setStatus('createStatus', 'Đang tải dữ liệu...');
                await Promise.all([loadClassrooms(), loadLevels(), loadMyAssignments()]);
                setStatus('createStatus', 'Đã tải classrooms và levels');
            } catch (err) {
                setStatus('createStatus', err.message, false);
            }
        }

        const dueInput = document.getElementById('dueDate');
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dueInput.value = now.toISOString().slice(0, 16);
    </script>
</body>

</html>
