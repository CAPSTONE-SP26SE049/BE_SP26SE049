<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FBF6EF; /* Matching Mobile Brand Background */
            color: #111827;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border: 3px solid #1F2937;
            border-radius: 20px;
            box-shadow: 6px 6px 0px #1F2937; /* Doodle style shadow */
            max-width: 90%;
            width: 350px;
        }
        .spinner {
            border: 4px solid #F3F4F6;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-top: 4px solid #49B6E5; /* Mobile Primary color */
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { 
            margin-top: 0;
            margin-bottom: 12px; 
            font-size: 20px;
            font-weight: 900;
        }
        p { 
            color: #4B5563; 
            font-size: 14px; 
            line-height: 1.5;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #49B6E5;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #1F2937;
            border-radius: 12px;
            font-weight: 800;
            box-shadow: 3px 3px 0px #1F2937;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #1F2937;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loader" class="spinner"></div>
        <h2 id="status-title">Đang xác thực...</h2>
        <p id="status-desc">Vui lòng chờ trong giây lát để hệ thống chuyển hướng bạn quay lại ứng dụng.</p>
        <a id="fallback-link" class="btn" href="#" style="display: none;">Quay lại ứng dụng</a>
    </div>

    <script>
        // Parse hash fragment or query parameters
        const hash = window.location.hash;
        const searchParams = new URLSearchParams(window.location.search);
        
        let token = '';
        let state = '';
        
        // 1. Check in hash (Implicit Flow sends token in hash fragment)
        if (hash) {
            const params = new URLSearchParams(hash.substring(1));
            token = params.get('access_token') || params.get('id_token') || params.get('token');
            state = params.get('state');
        }
        
        // 2. Check in query search (Standard flow fallback)
        if (!token) {
            token = searchParams.get('access_token') || searchParams.get('id_token') || searchParams.get('token');
        }
        if (!state) {
            state = searchParams.get('state');
        }

        if (state) {
            // Decode the state which contains the mobile application's redirect URI (deep link)
            const targetAppUri = decodeURIComponent(state);
            
            // Reconstruct the deep link with the token
            let redirectUrl = targetAppUri;
            if (token) {
                const separator = redirectUrl.includes('#') ? '&' : '#';
                redirectUrl = `${redirectUrl}${separator}access_token=${encodeURIComponent(token)}`;
            }

            console.log('Redirecting to deep link:', redirectUrl);
            
            const fallbackLink = document.getElementById('fallback-link');
            fallbackLink.href = redirectUrl;
            fallbackLink.style.display = 'inline-block';
            
            // Auto redirect
            window.location.href = redirectUrl;
            
            // Change message if auto-redirect is slow or doesn't trigger
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status-title').innerText = 'Kết nối lại ứng dụng';
                document.getElementById('status-desc').innerText = 'Nếu ứng dụng không tự động mở, vui lòng nhấn nút bên dưới:';
            }, 2500);
        } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('status-title').innerText = 'Lỗi cấu hình';
            document.getElementById('status-desc').innerText = 'Không tìm thấy tham số "state" chứa địa chỉ quay lại của ứng dụng.';
        }
    </script>
</body>
</html>
